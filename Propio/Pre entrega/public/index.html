<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FakeStore Admin</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .panel { background: #f4f4f4; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
        button { background: #007bff; color: white; border: none; padding: 8px 15px; cursor: pointer; border-radius: 4px;}
        button:hover { background: #0056b3; }
        input { padding: 5px; margin-right: 10px; }
        pre { background: #222; color: #0f0; padding: 15px; border-radius: 5px; max-height: 400px; overflow-y: auto; }
    </style>
</head>
<body>

    <h1>Gestor de Productos FakeStore</h1>

    <div class="panel">
        <h3>1. Ver Productos (GET)</h3>
        <button onclick="getProducts()">Cargar Productos</button>
    </div>

    <div class="panel">
        <h3>2. Crear Producto (POST)</h3>
        <input type="text" id="title" placeholder="Título (ej: Remera)">
        <input type="number" id="price" placeholder="Precio (ej: 300)">
        <input type="text" id="category" placeholder="Categoría (ej: Ropa)">
        <button onclick="createProduct()">Crear Producto</button>
    </div>

    <div class="panel">
        <h3>3. Eliminar Producto (DELETE)</h3>
        <input type="number" id="deleteId" placeholder="ID del producto (ej: 1)">
        <button onclick="deleteProduct()" style="background: #dc3545;">Eliminar Producto</button>
    </div>

    <h3>Resultados de la consola:</h3>
    <pre id="output">Esperando acciones...</pre>

    <script>
        const output = document.getElementById('output');

        function printResult(data) {
            output.textContent = JSON.stringify(data, null, 2);
        }

        async function getProducts() {
            output.textContent = "Cargando...";
            const res = await fetch('/api/products');
            const data = await res.json();
            printResult(data);
        }

        async function createProduct() {
            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;

            if(!title || !price || !category) return alert('Completa todos los campos');

            output.textContent = "Creando...";
            const res = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title, price, category })
            });
            const data = await res.json();
            printResult(data);
        }

        async function deleteProduct() {
            const id = document.getElementById('deleteId').value;
            if(!id) return alert('Ingresa un ID');

            output.textContent = "Eliminando...";
            const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
            const data = await res.json();
            printResult(data);
        }
    </script>
</body>
</html>
